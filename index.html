<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ລະບົບສະແກນໃບໜ້າ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    body { font-family: 'Noto Sans Lao', sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
    .view.active { display: flex; }
    .input-field { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: #d4af37; color: white; }
    .status { padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; width: 100%; }
    video { width: 100%; border-radius: 15px; background: #000; transform: scaleX(-1); }
  </style>
</head>
<body>

  <div id="view-home" class="view active">
    <h1>ລະບົບສະແກນໃບໜ້າ</h1>
    <button class="btn btn-primary" onclick="openScan('ເຂົ້າວຽກ')">📥 ສະແກນເຂົ້າວຽກ</button>
    <button class="btn" style="border: 2px solid #d4af37;" onclick="openScan('ອອກວຽກ')">📤 ສະແກນອອກວຽກ</button>
    <button class="btn" style="background: #e2e8f0;" onclick="openRegister()">+ ລົງທະບຽນໃໝ່</button>
  </div>

  <div id="view-scan" class="view">
    <video id="video-scan" autoplay playsinline muted></video>
    <div id="scan-status" class="status">ກຳລັງໂຫຼດ...</div>
    <button class="btn" onclick="goHome()">ຍົກເລີກ</button>
  </div>

  <div id="view-register" class="view">
    <h3>ລົງທະບຽນພະນັກງານ</h3>
    <input type="text" id="reg-id" class="input-field" disabled placeholder="ກຳລັງໂຫຼດລະຫັດ...">
    <input type="text" id="reg-name" class="input-field" placeholder="ຊື່ ແລະ ນາມສະກຸນ">
    <input type="text" id="reg-position" class="input-field" placeholder="ຕຳແໜ່ງ">
    <input type="date" id="reg-date" class="input-field">
    <input type="password" id="reg-pin" class="input-field" placeholder="ລະຫັດຜູ້ຈັດການ (PIN)">
    <video id="video-reg" autoplay playsinline muted></video>
    <div id="reg-status" class="status"></div>
    <button class="btn btn-primary" id="btn-save" onclick="performRegistration()">ບັນທຶກຂໍ້ມູນ</button>
    <button class="btn" onclick="goHome()">ຍົກເລີກ</button>
  </div>

  <script>
    // ⚠️ ใส่ลิงก์ Web App URL ของคุณที่นี่ตรงๆ ⚠️
    const API_URL = 'https://script.google.com/macros/s/AKfycby1dFXYXK06OVq7WuXMiOF8pDAh02ykId9HRR2zuHhqJQKiu3cODet1mKh_32TRmi8V5w/exec'; 

    // โหลดหน้าจอ
    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function goHome() { location.reload(); }

    // สแกนเข้า-ออก
    async function openScan(type) {
        switchView('view-scan');
        const video = document.getElementById('video-scan');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        // ต่อจากนั้นให้ใช้ face-api.js ทำงานเหมือนเดิม...
        document.getElementById('scan-status').innerText = "ກຳລັງສະແກນ " + type;
        // ส่งค่าไปที่ API_URL ด้วย fetch()
    }

    // ลงทะเบียน
    async function openRegister() {
        switchView('view-register');
        const res = await fetch(API_URL + '?action=getNextEmpId');
        const data = await res.json();
        document.getElementById('reg-id').value = data.nextId;
        const video = document.getElementById('video-reg');
        video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    }

    async function performRegistration() {
        const payload = {
            action: 'registerUser',
            name: document.getElementById('reg-name').value,
            position: document.getElementById('reg-position').value,
            startDate: document.getElementById('reg-date').value,
            managerPin: document.getElementById('reg-pin').value,
            faceDescriptor: [] // ใส่ค่าจาก face-api ที่นี่
        };

        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.success) alert("ບັນທຶກສຳເລັດ!");
        else alert("ຜິດພາດ: " + result.error);
    }
  </script>
</body>
</html>
