<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ລະບົບບັນທຶກເວລາເຂົ້າວຽກ (White & Gold)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Noto Sans Lao', sans-serif;
      min-height: 100vh;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      color: #334155; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    .view {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; padding: 20px; z-index: 1;
    }
    .view.active { display: flex; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .header { text-align: center; margin-bottom: 40px; }
    
    .logo-container {
      width: 120px; height: 120px;
      background: #ffffff;
      border: 3px solid #d4af37;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
    }
    .logo-icon { font-size: 60px; }
    h1 { font-size: 1.8em; color: #1e293b; margin-bottom: 8px; font-weight: 700; }
    
    .action-buttons { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 320px; }
    .btn-main {
      padding: 18px; border-radius: 16px; font-size: 20px; font-weight: 700;
      text-align: center; cursor: pointer; border: none;
      transition: all 0.2s; font-family: 'Noto Sans Lao';
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-main:active { transform: scale(0.95); }
    
    .btn-in { 
      background: linear-gradient(135deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .btn-out { 
      background: #ffffff; 
      color: #d4af37; 
      border: 2px solid #d4af37; 
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }
    
    .btn-register {
      position: fixed; bottom: 20px; right: 20px;
      background: #ffffff; border: 1px solid #e2e8f0;
      color: #64748b; padding: 12px 20px;
      border-radius: 12px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s; z-index: 10; font-family: 'Noto Sans Lao';
    }
    .btn-register:hover { color: #d4af37; border-color: #d4af37; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); }

    .page-title { font-size: 24px; color: #1e293b; margin-bottom: 20px; }
    
    .video-container {
      position: relative; width: 100%; max-width: 350px;
      border-radius: 20px; overflow: hidden;
      border: 4px solid #ffffff; 
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
      background: #000; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
      min-height: 250px;
    }
    video { width: 100%; height: auto; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); }
    
    .status-box {
      width: 100%; max-width: 350px; padding: 15px; border-radius: 12px;
      background: #ffffff; text-align: center; margin-bottom: 20px;
      font-size: 16px; font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      transition: all 0.3s;
    }
    .status-wait { color: #d4af37; } 
    .status-success { color: #10b981; border-color: #10b981;} 
    .status-error { color: #ef4444; border-color: #ef4444;}
    
    .form-group { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .input-field {
      width: 100%; padding: 14px 18px; border-radius: 12px;
      border: 1px solid #cbd5e1; background: #ffffff;
      color: #334155; font-size: 16px; font-family: 'Noto Sans Lao'; outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .input-field:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
    
    .btn-row { display: flex; gap: 10px; width: 100%; max-width: 350px; }
    .btn-cancel {
      background: #f1f5f9; border: 1px solid #cbd5e1; color: #64748b;
      padding: 12px; border-radius: 10px; font-size: 16px; cursor: pointer; flex: 1; font-family: 'Noto Sans Lao';
    }
    .btn-capture {
      background: linear-gradient(135deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
      border: none; color: white;
      padding: 12px; border-radius: 10px; font-size: 16px; cursor: pointer; flex: 2; font-weight: bold; font-family: 'Noto Sans Lao';
    }
    .btn-capture:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }

    .overlay {
      position: absolute; top:0; left:0; right:0; bottom:0;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 5;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    
    .spinner { 
      border: 4px solid rgba(212, 175, 55, 0.2); 
      border-top: 4px solid #d4af37; 
      border-radius: 50%; width: 50px; height: 50px; 
      animation: spin 1s linear infinite; margin-bottom: 15px; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #scan-overlay-text { color: #1e293b; font-weight: 600; text-align: center; padding: 0 10px;}
    
    #global-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f8fafc; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>

  <div id="global-loader">
    <div class="spinner"></div>
    <h2 style="margin-top: 20px; color: #d4af37;">ກຳລັງໂຫຼດລະບົບ AI...</h2>
  </div>

  <div id="view-home" class="view">
    <div class="header">
      <div class="logo-container">
        <span class="logo-icon">👑</span> 
      </div>
      <h1>ລະບົບສະແກນໃບໜ້າ</h1>
    </div>

    <div class="action-buttons">
      <button class="btn-main btn-in" onclick="openScan('ເຂົ້າວຽກ')">
        <span style="font-size: 24px;">📥</span> ສະແກນເຂົ້າວຽກ
      </button>
      <button class="btn-main btn-out" onclick="openScan('ອອກວຽກ')">
        <span style="font-size: 24px;">📤</span> ສະແກນອອກວຽກ
      </button>
    </div>

    <button class="btn-register" onclick="openRegister()">+ ລົງທະບຽນພະນັກງານ</button>
  </div>

  <div id="view-scan" class="view">
    <h2 id="scan-title" class="page-title">ສະແກນໃບໜ້າ</h2>
    
    <div class="video-container" id="video-scan-container">
      <video id="video-scan" autoplay playsinline muted></video>
      <div id="scan-overlay" class="overlay">
        <div class="spinner"></div>
        <div id="scan-overlay-text">ກຳລັງຄົ້ນຫາໃບໜ້າ...</div>
      </div>
    </div>

    <div id="scan-status" class="status-box status-wait">📍 ກຳລັງກວດສອບທີ່ຕັ້ງ GPS...</div>

    <button class="btn-cancel" onclick="goHome()" style="max-width: 200px;">ຍ້ອນກັບ</button>
  </div>

  <div id="view-register" class="view" style="padding-top: 50px;">
    <h2 class="page-title" style="margin-bottom: 15px;">ລົງທະບຽນພະນັກງານໃໝ່</h2>
    
    <div class="form-group">
      <div style="position: relative;">
        <span style="position: absolute; top: -8px; left: 10px; background: #fff; padding: 0 5px; font-size: 12px; color: #64748b; font-weight: bold;">ລະຫັດພະນັກງານ (Auto)</span>
        <input type="text" id="reg-id" class="input-field" disabled style="background: #f1f5f9; color: #94a3b8; font-weight: bold; text-align: center; font-size: 18px;" value="ກຳລັງໂຫຼດ...">
      </div>

      <input type="text" id="reg-name" class="input-field" placeholder="ຊື່ ແລະ ນາມສະກຸນ (ຈຳເປັນ)">
      <input type="text" id="reg-position" class="input-field" placeholder="ຕຳແໜ່ງ (ເຊັ່ນ: ພະນັກງານເສີບ)">
      
      <div style="position: relative;">
        <span style="position: absolute; top: -8px; left: 10px; background: #fff; padding: 0 5px; font-size: 12px; color: #d4af37;">ວັນທີເລີ່ມວຽກ</span>
        <input type="date" id="reg-date" class="input-field">
      </div>

      <div style="position: relative;">
        <span style="position: absolute; top: -8px; left: 10px; background: #fff; padding: 0 5px; font-size: 12px; color: #ef4444; font-weight: bold;">ລະຫັດຜູ້ຈັດການ (PIN) *</span>
        <input type="password" id="reg-pin" class="input-field" placeholder="ສຳລັບຜູ້ຈັດການຮ້ານເທົ່ານັ້ນ" style="border: 1px solid #ef4444;">
      </div>
    </div>

    <div class="video-container" style="min-height: 200px; margin-bottom: 10px; border-color: #f1f5f9;">
      <video id="video-reg" autoplay playsinline muted></video>
    </div>

    <div id="reg-status" class="status-box status-wait" style="display:none; font-size: 14px; padding: 10px;"></div>

    <div class="btn-row">
      <button class="btn-cancel" onclick="goHome()">ຍົກເລີກ</button>
      <button class="btn-capture" id="btn-reg-save" onclick="performRegistration()">📸 ບັນທຶກຂໍ້ມູນ</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. ການຕັ້ງຄ່າ (Configuration)
    // ==========================================
    // ⚠️ ใส่ลิงก์ Web App URL ของคุณที่นี่ ⚠️
    let API_URL = 'https://script.google.com/macros/s/AKfycby1dFXYXK06OVq7WuXMiOF8pDAh02ykId9HRR2zuHhqJQKiu3cODet1mKh_32TRmi8V5w/exec'; 
    
    let SHOP_LAT = 17.9757;
    let SHOP_LNG = 102.6331;
    let MAX_DISTANCE_KM = 0.5;
    const MATCH_THRESHOLD = 0.45;

    let currentStream = null, scanActionType = '', faceMatcher = null, scanInterval = null;
    let userCurrentLat = null, userCurrentLng = null;

    // ==========================================
    // 2. ໂຫຼດ AI ແລະ ຂໍ້ມູນພະນັກງານ
    // ==========================================
    async function initApp() {
        try {
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);

            if(API_URL) await fetchServerData();

            document.getElementById('global-loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('global-loader').style.display = 'none';
                switchView('view-home');
            }, 500);
        } catch (error) { document.getElementById('global-loader').innerHTML = `<h3 style="color:#ef4444">ເກີດຂໍ້ຜິດພາດ: ${error.message}</h3>`; }
    }

    async function fetchServerData() {
        try {
            const confRes = await fetch(API_URL + '?action=getConfig');
            const confData = await confRes.json();
            if(!confData.error) {
                SHOP_LAT = parseFloat(confData.lat); SHOP_LNG = parseFloat(confData.lng); MAX_DISTANCE_KM = parseFloat(confData.radius);
            }
            const faceRes = await fetch(API_URL + '?action=getKnownFaces');
            const faceData = await faceRes.json();
            if(!faceData.error && faceData.length > 0) {
                const labeledDescriptors = faceData.map(d => new faceapi.LabeledFaceDescriptors(d.label, [new Float32Array(d.descriptor)]));
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, MATCH_THRESHOLD);
            }
        } catch (e) { console.error("Error:", e); }
    }
    
    window.onload = initApp;

    // ==========================================
    // 3. ຄວບຄຸມໜ້າຈໍ ແລະ ກ້ອງຖ່າຍຮູບ
    // ==========================================
    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }
    function goHome() {
      stopCamera();
      if(scanInterval) clearInterval(scanInterval);
      switchView('view-home');
      document.getElementById('scan-overlay').classList.remove('active');
    }

    async function startCamera(videoElementId) {
      const videoEl = document.getElementById(videoElementId);
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        videoEl.srcObject = currentStream;
        return new Promise(resolve => videoEl.onloadedmetadata = () => resolve(videoEl));
      } catch (err) { throw err; }
    }
    function stopCamera() {
      if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    }

    function showStatus(elementId, text, type) {
        const el = document.getElementById(elementId);
        el.style.display = 'block'; el.innerText = text;
        if(type === 'error') el.className = 'status-box status-error';
        else if(type === 'success') el.className = 'status-box status-success';
        else el.className = 'status-box status-wait';
    }

    // ==========================================
    // 4. ກວດສອບ GPS (Geofencing)
    // ==========================================
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }
    
    function checkLocation() {
        return new Promise((resolve, reject) => {
            const isCanvasTest = window.location.hostname === '' || window.location.hostname === 'localhost' || window.location.href.includes('preview');
            if(isCanvasTest && !navigator.geolocation) { userCurrentLat = SHOP_LAT; userCurrentLng = SHOP_LNG; resolve({ passed: true, dist: 0 }); return; }
            if (!navigator.geolocation) { reject(new Error("Browser ບໍ່ຮອງຮັບ GPS")); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCurrentLat = pos.coords.latitude; userCurrentLng = pos.coords.longitude;
                    if (MAX_DISTANCE_KM === 0) { resolve({ passed: true, dist: 0 }); return; }
                    resolve({ passed: haversineKm(SHOP_LAT, SHOP_LNG, userCurrentLat, userCurrentLng) <= MAX_DISTANCE_KM || isCanvasTest, dist: haversineKm(SHOP_LAT, SHOP_LNG, userCurrentLat, userCurrentLng) });
                },
                (err) => reject(new Error("ບໍ່ອະນຸຍາດເຂົ້າເຖິງ GPS")), { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    // ==========================================
    // 5. ລະບົບສະແກນເຂົ້າ-ອອກວຽກ
    // ==========================================
    async function openScan(type) {
      scanActionType = type;
      document.getElementById('scan-title').innerText = "ສະແກນ" + type;
      showStatus('scan-status', '📍 ກຳລັງກວດສອບທີ່ຕັ້ງ GPS...', 'wait');
      document.getElementById('scan-overlay').classList.remove('active');
      switchView('view-scan');
      
      try {
          const videoEl = await startCamera('video-scan');
          const locResult = await checkLocation();
          if(locResult.passed) {
              showStatus('scan-status', `✅ ທີ່ຕັ້ງຖືກຕ້ອງ! ກະລຸນາມອງກ້ອງ`, 'success');
              startFaceRecognition(videoEl);
          } else {
              showStatus('scan-status', `❌ ຢູ່ນອກພື້ນທີ່ຮ້ານ ບໍ່ສາມາດສະແກນໄດ້`, 'error'); stopCamera();
          }
      } catch (err) { showStatus('scan-status', `❌ ${err.message}`, 'error'); stopCamera(); }
    }

    function startFaceRecognition(videoEl) {
        if(!faceMatcher && API_URL) { showStatus('scan-status', "⚠️ ຍັງບໍ່ມີຂໍ້ມູນພະນັກງານໃນລະບົບ", 'wait'); return; } 
        else if (!API_URL) { setTimeout(simulateFaceScan, 2000); return; }

        const overlay = document.getElementById('scan-overlay'); const overlayText = document.getElementById('scan-overlay-text');
        overlay.classList.add('active'); overlayText.innerText = "🤖 ກຳລັງປະມວນຜົນໃບໜ້າ...";

        scanInterval = setInterval(async () => {
            const detection = await faceapi.detectSingleFace(videoEl).withFaceLandmarks().withFaceDescriptor();
            if(detection) {
                const match = faceMatcher.findBestMatch(detection.descriptor);
                if (match.label !== 'unknown') {
                    clearInterval(scanInterval);
                    overlayText.innerText = `✅ ພົບໃບໜ້າ: ${match.label}\nກຳລັງບັນທຶກຂໍ້ມູນ...`;
                    saveAttendance(match.label);
                } else { overlayText.innerText = "❌ ບໍ່ພົບໃບໜ້າໃນຖານຂໍ້ມູນ"; }
            } else { overlayText.innerText = "ກະລຸນາມອງກ້ອງໃຫ້ຊັດເຈນ"; }
        }, 1000);
    }

    async function saveAttendance(employeeName) {
        try {
            const res = await fetch(API_URL, {
                method: 'POST', body: JSON.stringify({ action: 'logAttendance', name: employeeName, lat: userCurrentLat, lng: userCurrentLng, type: scanActionType })
            });
            const data = await res.json();
            if (data.error || data.success === false) { throw new Error(data.error); }
            
            document.getElementById('scan-overlay-text').innerText = `✅ ບັນທຶກ "${scanActionType}" ສຳເລັດ!`;
            document.querySelector('.spinner').style.display = 'none';
            setTimeout(() => { document.querySelector('.spinner').style.display = 'block'; goHome(); }, 2000);
        } catch (e) {
            document.getElementById('scan-overlay-text').innerHTML = `<span style="color:#ef4444; font-size:20px;">❌ ປະຕິເສດ:</span><br/><span style="font-size:16px;">${e.message}</span>`;
            document.querySelector('.spinner').style.display = 'none';
            setTimeout(() => { document.querySelector('.spinner').style.display = 'block'; goHome(); }, 4000);
        }
    }

    function simulateFaceScan() {
      const overlay = document.getElementById('scan-overlay'); const text = document.getElementById('scan-overlay-text');
      overlay.classList.add('active'); text.innerText = "🤖 ກຳລັງປະມວນຜົນໃບໜ້າ... (ຈຳລອງ)";
      setTimeout(() => {
        text.innerText = `✅ ບັນທຶກ "${scanActionType}" ສຳເລັດ! (ຈຳລອງ)`; document.querySelector('.spinner').style.display = 'none';
        setTimeout(() => { document.querySelector('.spinner').style.display = 'block'; goHome(); }, 2000);
      }, 2000);
    }

    // ==========================================
    // 6. ລະບົບລົງທະບຽນ (ອັບເດດລ່າສຸດ)
    // ==========================================
    async function openRegister() {
      document.getElementById('reg-id').value = 'ກຳລັງໂຫຼດລະຫັດ...';
      document.getElementById('reg-name').value = ''; 
      document.getElementById('reg-position').value = ''; 
      document.getElementById('reg-date').value = '';
      document.getElementById('reg-pin').value = '';
      document.getElementById('reg-status').style.display = 'none'; 
      document.getElementById('btn-reg-save').disabled = false;
      
      switchView('view-register'); 
      try {
        await startCamera('video-reg');
        // ດຶງລະຫັດພະນັກງານລ່າສຸດຈາກ Server
        if(API_URL) {
           const res = await fetch(API_URL + '?action=getNextEmpId');
           const data = await res.json();
           document.getElementById('reg-id').value = data.nextId || 'FR01';
        } else {
           document.getElementById('reg-id').value = 'FR01 (ຈຳລອງ)';
        }
      } catch(err) {
        showStatus('reg-status', '❌ ບໍ່ສາມາດເປີດກ້ອງໄດ້', 'error');
      }
    }

    async function performRegistration() {
      const name = document.getElementById('reg-name').value.trim();
      const position = document.getElementById('reg-position').value.trim();
      const date = document.getElementById('reg-date').value;
      const pin = document.getElementById('reg-pin').value.trim();
      const btnSave = document.getElementById('btn-reg-save');
      
      if(!name) { showStatus('reg-status', '⚠️ ກະລຸນາປ້ອນຊື່ກ່ອນເດີ້!', 'error'); return; }
      if(!pin) { showStatus('reg-status', '⚠️ ກະລຸນາປ້ອນລະຫັດຜູ້ຈັດການ (PIN)!', 'error'); return; }
      
      btnSave.disabled = true; 
      showStatus('reg-status', '⏳ ກຳລັງວິເຄາະໃບໜ້າ...', 'wait');
      const videoEl = document.getElementById('video-reg');
      
      try {
          const detection = await faceapi.detectSingleFace(videoEl).withFaceLandmarks().withFaceDescriptor();
          if(!detection) { 
              showStatus('reg-status', '❌ ບໍ່ພົບໃບໜ້າ! ກະລຸນາມອງກ້ອງ', 'error');
              btnSave.disabled = false; return; 
          }
          
          showStatus('reg-status', '⏳ ກຳລັງບັນທຶກລົງຖານຂໍ້ມູນ...', 'wait');
          const descriptorArray = Array.from(detection.descriptor);
          
          if(API_URL) {
              const res = await fetch(API_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: 'registerUser', name: name, position: position, startDate: date, faceDescriptor: descriptorArray, managerPin: pin })
              });
              const data = await res.json();
              if(data.error) throw new Error(data.error);
              fetchServerData(); 
          } else {
              await new Promise(r => setTimeout(r, 1000));
              if(pin !== '9999') throw new Error("ລະຫັດຜູ້ຈັດການບໍ່ຖືກຕ້ອງ! (ຈຳລອງ)");
          }
          
          showStatus('reg-status', `✅ ລົງທະບຽນ "${name}" ສຳເລັດແລ້ວ!`, 'success');
          setTimeout(() => { goHome(); }, 2000);
      } catch (err) { 
          showStatus('reg-status', `❌ ປະຕິເສດ: ${err.message}`, 'error'); 
          btnSave.disabled = false; 
      }
    }
  </script>
</body>
