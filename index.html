<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ລະບົບສະແກນໃບໜ້າ - wolf2626</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans Lao', sans-serif; min-height: 100vh; background-color: #f8fafc; color: #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .view { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; padding: 20px; z-index: 1; }
    .view.active { display: flex; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .logo-container { width: 120px; height: 120px; border: 3px solid #d4af37; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25); overflow: hidden; background: white;}
    .logo-icon { font-size: 60px; }
    h1, h2 { color: #1e293b; margin-bottom: 20px; font-weight: 700; text-align: center;}
    
    .btn { width: 100%; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; margin-bottom: 12px; transition: 0.2s; font-family: inherit; }
    .btn:active { transform: scale(0.97); }
    .btn-in { background: linear-gradient(135deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%); color: white; box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }
    .btn-out { background: white; color: #d4af37; border: 2px solid #d4af37; }
    .btn-list { background: #e2e8f0; color: #475569; }
    .btn-cancel { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    
    .input-field { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #cbd5e1; margin-bottom: 15px; font-size: 16px; font-family: inherit; }
    .input-field:focus { outline: none; border-color: #d4af37; }
    
    .video-container { position: relative; width: 100%; border-radius: 15px; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #000; margin-bottom: 20px; }
    video, canvas { width: 100%; transform: scaleX(-1); display: block; }
    canvas { position: absolute; top: 0; left: 0; }
    
    .status-box { width: 100%; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; font-weight: bold; }
    .wait { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-weight: bold; color: #d4af37; font-size: 18px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f4f6; border-top: 4px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <span>ກຳລັງໂຫຼດລະບົບ...</span>
  </div>

  <div id="view-home" class="view">
    <div class="logo-container">
      <span class="logo-icon">👑</span> 
      </div>
    <h1>ລະບົບສະແກນໃບໜ້າ</h1>
    <button class="btn btn-in" onclick="openScan('ເຂົ້າວຽກ')">📥 ສະແກນເຂົ້າວຽກ</button>
    <button class="btn btn-out" onclick="openScan('ອອກວຽກ')">📤 ສະແກນອອກວຽກ</button>
    <button class="btn btn-list" onclick="openRegister()">+ ລົງທະບຽນພະນັກງານ</button>
    <button class="btn btn-list" style="background: #cbd5e1; margin-top: 10px;" onclick="openEmployeeList()">📋 ລາຍຊື່ພະນັກງານທັງໝົດ</button>
  </div>

  <div id="view-scan" class="view">
    <h2 id="scan-title">ສະແກນໃບໜ້າ</h2>
    <div class="video-container">
      <video id="video-scan" autoplay playsinline muted></video>
    </div>
    <div id="scan-status" class="status-box wait">ກຳລັງໂຫຼດກ້ອງ...</div>
    <button class="btn btn-cancel" onclick="goHome()">ຍ້ອນກັບ</button>
  </div>

  <div id="view-register" class="view" style="padding-top: 50px;">
    <h2>ລົງທະບຽນໃໝ່</h2>
    <input type="text" id="reg-id" class="input-field" disabled placeholder="ກຳລັງໂຫຼດລະຫັດ...">
    <input type="text" id="reg-name" class="input-field" placeholder="ຊື່ ແລະ ນາມສະກຸນ (ຈຳເປັນ)">
    <input type="text" id="reg-position" class="input-field" placeholder="ຕຳແໜ່ງ / ແຜນກ">
    <input type="date" id="reg-date" class="input-field">
    <input type="password" id="reg-pin" class="input-field" placeholder="ລະຫັດຜູ້ຈັດການ (PIN) *" style="border-color: #ef4444;">
    
    <div class="video-container" style="min-height: 200px;">
      <video id="video-reg" autoplay playsinline muted></video>
    </div>
    <div id="reg-status" class="status-box wait" style="display:none;"></div>
    
    <div style="display: flex; gap: 10px; width: 100%;">
      <button class="btn btn-cancel" onclick="goHome()">ຍົກເລີກ</button>
      <button class="btn btn-in" id="btn-save" onclick="performRegistration()">ບັນທຶກ</button>
    </div>
  </div>

  <div id="view-employee-list" class="view">
    <h2>📋 ລາຍຊື່ພະນັກງານ</h2>
    <div id="emp-list-container" style="width: 100%; max-height: 400px; overflow-y: auto; background: white; border-radius: 12px; padding: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
       <div class="status-box wait">ກຳລັງໂຫຼດຂໍ້ມູນ...</div>
    </div>
    <button class="btn btn-cancel" onclick="goHome()">ຍ້ອນກັບ</button>
  </div>

  <script>
    // ⚠️⚠️ เอาลิงก์ Web App URL (หลังกด New Version) มาใส่ตรงนี้ครับ ⚠️⚠️
    const API_URL = 'https://script.google.com/macros/s/AKfycby1dFXYXK06OVq7WuXMiOF8pDAh02ykId9HRR2zuHhqJQKiu3cODet1mKh_32TRmi8V5w/exec'; 
    
    let faceMatcher = null, currentStream = null, scanInterval = null;
    let shopLat = 0, shopLng = 0, maxDist = 0.5, userLat = 0, userLng = 0;
    let scanType = '';

    window.onload = async () => {
      try {
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        
        if(API_URL) {
            const confRes = await fetch(API_URL + '?action=getConfig');
            const confData = await confRes.json();
            shopLat = parseFloat(confData.lat); shopLng = parseFloat(confData.lng); maxDist = parseFloat(confData.radius);
            
            const faceRes = await fetch(API_URL + '?action=getKnownFaces');
            const faces = await faceRes.json();
            if(faces && faces.length > 0) {
                const labeled = faces.map(d => new faceapi.LabeledFaceDescriptors(d.label, [new Float32Array(d.descriptor)]));
                faceMatcher = new faceapi.FaceMatcher(labeled, 0.45);
            }
        }
        document.getElementById('loader').style.display = 'none';
        switchView('view-home');
      } catch (e) {
        document.getElementById('loader').innerHTML = `<span style="color:red">Error: ${e.message}</span>`;
      }
    };

    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goHome() {
      if(currentStream) currentStream.getTracks().forEach(t => t.stop());
      if(scanInterval) clearInterval(scanInterval);
      location.reload();
    }

    function setStatus(id, text, type) {
      const el = document.getElementById(id);
      el.style.display = 'block'; el.innerText = text;
      el.className = `status-box ${type}`;
    }

    // --- GPS ---
    function checkLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude; userLng = pos.coords.longitude;
            if(maxDist === 0) return resolve(true);
            const R = 6371; const dLat = (shopLat - userLat) * Math.PI / 180; const dLon = (shopLng - userLng) * Math.PI / 180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(userLat*Math.PI/180)*Math.cos(shopLat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            const dist = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            resolve(dist <= maxDist);
          }, () => resolve(true), { enableHighAccuracy: true, timeout: 5000 }
        );
      });
    }

    // --- SCAN ---
    async function openScan(type) {
      scanType = type;
      document.getElementById('scan-title').innerText = "ສະແກນ" + type;
      switchView('view-scan');
      setStatus('scan-status', '📍 ກຳລັງກວດສອບ GPS...', 'wait');

      try {
        const video = document.getElementById('video-scan');
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = currentStream;
        
        const locPassed = await checkLocation();
        if(!locPassed) { setStatus('scan-status', '❌ ຢູ່ນອກພື້ນທີ່ຮ້ານ', 'error'); return; }
        
        if(!faceMatcher) { setStatus('scan-status', '⚠️ ບໍ່ມີຂໍ້ມູນພະນັກງານ', 'error'); return; }
        
        setStatus('scan-status', '🤖 ກຳລັງປະມວນຜົນ...', 'wait');
        scanInterval = setInterval(async () => {
          const det = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
          if(det) {
            const match = faceMatcher.findBestMatch(det.descriptor);
            if(match.label !== 'unknown') {
              clearInterval(scanInterval);
              setStatus('scan-status', `✅ ພົບໃບໜ້າ: ${match.label} ກຳລັງບັນທຶກ...`, 'wait');
              saveAttendance(match.label);
            }
          }
        }, 1000);
      } catch(e) { setStatus('scan-status', '❌ ເປີດກ້ອງບໍ່ໄດ້', 'error'); }
    }

    async function saveAttendance(name) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'logAttendance', name: name, lat: userLat, lng: userLng, type: scanType })
        });
        const data = await res.json();
        if(data.success) {
          setStatus('scan-status', '✅ ບັນທຶກສຳເລັດ!', 'success');
          setTimeout(goHome, 2000);
        } else {
          setStatus('scan-status', `❌ ${data.error}`, 'error');
        }
      } catch(e) { setStatus('scan-status', '❌ ຜິດພາດໃນການບັນທຶກ', 'error'); }
    }

    // --- REGISTER ---
    async function openRegister() {
      switchView('view-register');
      setStatus('reg-status', '', 'wait'); document.getElementById('reg-status').style.display = 'none';
      try {
        const res = await fetch(API_URL + '?action=getNextEmpId');
        const data = await res.json();
        document.getElementById('reg-id').value = data.nextId;
        
        const video = document.getElementById('video-reg');
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = currentStream;
      } catch(e) {}
    }

    async function performRegistration() {
      const name = document.getElementById('reg-name').value.trim();
      const pin = document.getElementById('reg-pin').value.trim();
      if(!name || !pin) { setStatus('reg-status', 'ກະລຸນາປ້ອນຊື່ ແລະ ລະຫັດ PIN', 'error'); return; }
      
      document.getElementById('btn-save').disabled = true;
      setStatus('reg-status', '⏳ ກຳລັງສະແກນໃບໜ້າ...', 'wait');
      const video = document.getElementById('video-reg');
      const det = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      
      if(!det) { 
        setStatus('reg-status', '❌ ບໍ່ພົບໃບໜ້າ! ມອງກ້ອງໃຫ້ຊັດເຈນ', 'error'); 
        document.getElementById('btn-save').disabled = false; return; 
      }
      
      setStatus('reg-status', '⏳ ກຳລັງບັນທຶກ...', 'wait');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'registerUser', name: name,
            position: document.getElementById('reg-position').value,
            startDate: document.getElementById('reg-date').value,
            managerPin: pin, faceDescriptor: Array.from(det.descriptor)
          })
        });
        const data = await res.json();
        if(data.success) {
          setStatus('reg-status', '✅ ລົງທະບຽນສຳເລັດ!', 'success');
          setTimeout(goHome, 2000);
        } else {
          setStatus('reg-status', `❌ ${data.error}`, 'error');
          document.getElementById('btn-save').disabled = false;
        }
      } catch(e) { setStatus('reg-status', '❌ ເຊື່ອມຕໍ່ຜິດພາດ', 'error'); document.getElementById('btn-save').disabled = false; }
    }

    // --- EMPLOYEE LIST ---
    async function openEmployeeList() {
      switchView('view-employee-list');
      const container = document.getElementById('emp-list-container');
      container.innerHTML = '<div class="status-box wait">⏳ ກຳລັງໂຫຼດຂໍ້ມູນ...</div>';

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getEmployees' }) });
        const data = await res.json();

        if (data.success && data.employees.length > 0) {
          let html = '<table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">';
          html += '<tr style="background: #f1f5f9;"><th style="padding: 10px; border-bottom: 2px solid #cbd5e1;">ລະຫັດ</th><th style="padding: 10px; border-bottom: 2px solid #cbd5e1;">ຊື່</th><th style="padding: 10px; border-bottom: 2px solid #cbd5e1;">ຕຳແໜ່ງ</th></tr>';
          data.employees.forEach(emp => {
            html += `<tr>
              <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #d4af37;">${emp.id}</td>
              <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${emp.name}</td>
              <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; color: #64748b;">${emp.dept}</td>
            </tr>`;
          });
          html += '</table>';
          container.innerHTML = html;
        } else {
          container.innerHTML = '<div class="status-box wait">ຍັງບໍ່ມີຂໍ້ມູນພະນັກງານ</div>';
        }
      } catch (e) { container.innerHTML = '<div class="status-box error">❌ ບໍ່ສາມາດໂຫຼດຂໍ້ມູນໄດ້</div>'; }
    }
  </script>
</body>
</html>
